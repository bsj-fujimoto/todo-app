# frontend: 静的配信 + /api を backend へ中継（nginxinc/nginx-unprivileged の conf.d/default.conf として配置する）

# クライアントの x-request-id を素通しし、無ければ nginx が採番する
map $http_x_request_id $todo_request_id {
  default $http_x_request_id;
  ""      $request_id;
}

server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # セキュリティヘッダ（location に add_header を書くと継承が切れるため、location では add_header を使わない）
  # base-uri・form-action・frame-ancestors は default-src にフォールバックしないので、明示する（ZAP 10055）
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Cross-Origin-Embedder-Policy "require-corp" always;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_vary on;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

  # 死活（frontend 自身。backend には依存しない）
  location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
  }

  # backend へ中継。Docker の DNS（127.0.0.11）で名前を引き直すので、backend コンテナが再起動して IP が変わっても追従する。
  # 変数で proxy_pass するため、リクエスト URI はそのまま backend へ渡る。
  location /api/ {
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $backend_upstream http://backend:3000;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $todo_request_id;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
  }

  location / {
    try_files $uri $uri/ =404;
    # 静的ファイルは更新が即時に反映されるよう、毎回再検証させる
    expires -1;
  }
}
