<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My TODO</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <main class="app">
      <h1>My TODO</h1>

      <!-- 保存エラー・保存データ破損は画面上部に出す -->
      <div class="top-area">
        <div id="save-error" class="banner" role="alert"></div>
        <button id="retry-button" type="button" class="secondary" hidden>再読み込み</button>
      </div>

      <!-- 入力エラーは入力欄の直下（DOM 上も入力欄の直後）に出す -->
      <form id="add-form" class="entry" novalidate>
        <label class="visually-hidden" for="title-input">タスク名</label>
        <input
          id="title-input"
          name="title"
          type="text"
          autocomplete="off"
          placeholder="タスクを入力（100文字まで）"
          aria-describedby="input-error"
          disabled
        />
        <p id="input-error" class="field-error" role="alert"></p>
        <button id="add-button" type="submit" disabled>追加</button>
      </form>

      <p id="list-message" class="list-message" role="status" tabindex="-1">読み込み中…</p>
      <ul id="task-list" class="tasks" role="list" aria-label="タスク一覧" hidden></ul>
    </main>
  </body>
</html>
