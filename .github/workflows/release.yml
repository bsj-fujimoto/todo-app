name: Release

# リリース前層: タグ（v*.*.*）の push で、全件回帰（ci.yml）+ compose + セキュリティ（security.yml）を再利用して通し、
# 通ったら両イメージを GHCR へ push（digest 固定）→ provenance（SLSA）・SBOM・cosign keyless 署名 → GitHub Release を作る。
# デプロイは行わない（本リポジトリに本番は無い）。リリースは、synthetic / 外形監視が参照する版情報（デプロイマーカー）の源。
#
# dry-run（公開しない）: workflow_dispatch で publish=false（既定）、またはこのワークフロー・Dockerfile を変えた PR。
#   dry-run は、イメージを OCI アーカイブにビルドする（SBOM・provenance つき）ところまで。push・署名・Release 作成はしない。
#   PR の dry-run は ci.yml / security.yml を呼ばない（PR では別に動いているため）。
# タグの push・リリースの作成はリポジトリの管理者が行う（このワークフローの作者は行わない）。
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "リリースの版（例 v0.1.0）。publish=false のときは任意"
        type: string
        default: v0.0.0-dryrun
      publish:
        description: "true: push・署名・Release 作成まで行う。false: dry-run（ビルドまで）"
        type: boolean
        default: false
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/ci/release-evidence.mjs"
      - "scripts/ci/lib/release-notes.mjs"
      - "backend/Dockerfile"
      - "frontend/Dockerfile"

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  # 対象 SHA を明示する。pull_request では merge commit ではなく PR の head を対象にする。
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  # ---- リリース前層（全件回帰 + compose + セキュリティ）。dry-run の PR では呼ばない ------------------
  ci:
    name: ci（全件回帰 + compose）
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  security:
    name: security（SAST・Secret・SCA・Container・License・DAST・ワークフロー統制）
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/security.yml
    with:
      create_issues: false
    permissions:
      contents: read
      security-events: write # security.yml の sast / container-iac が Code Scanning に SARIF を上げる
      actions: read # triage が前回の findings.json を取得する
      issues: write # security.yml の file-security-issues が要求する（create_issues=false なので動かない）

  # ---- 証跡の検査（リリースの版の証跡が、実際の結果と一致し、改変されていないこと）---------------------
  # 実施表・不具合表・証拠索引・manifest の整合を、リリースの SHA を渡して厳格に検査する（別の版の行が残っていれば失敗。台帳が古くても失敗）。
  # 証跡の取り込み（fetch-run.mjs）と commit はリポジトリの管理者が事前に行う（scripts/evidence/README.md）。ワークフローは main へ commit しない。
  evidence-check:
    name: evidence-check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0 # 成果物台帳（artifacts.yaml）の履歴を、コミット履歴と突き合わせる
          persist-credentials: false
      - uses: ./.github/actions/setup-node-npm
        with:
          install: "false"
      - name: 証跡一式の検査（--release で版を固定し、--strict で台帳の古さも失敗にする）
        run: node scripts/evidence/check-evidence.mjs --out reports/evidence-check-report.json --release "$TARGET_SHA" --strict
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidence-check-report
          path: reports
          retention-days: 90
          if-no-files-found: error

  # ---- 公開（ビルド・push・provenance・署名・SBOM・Release）---------------------------------------
  publish:
    name: publish
    needs: [ci, security, evidence-check]
    # dry-run の PR では ci / security / evidence-check が skipped になる。リリースでは全部 success でなければ公開しない（失敗・skipped を成功扱いにしない）
    if: ${{ !cancelled() && needs.ci.result != 'failure' && needs.security.result != 'failure' && needs.evidence-check.result != 'failure' && (github.event_name == 'pull_request' || (needs.ci.result == 'success' && needs.security.result == 'success' && needs.evidence-check.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write # GitHub Release の作成
      packages: write # GHCR への push
      id-token: write # cosign keyless 署名・provenance の OIDC（このジョブだけ）
      attestations: write # provenance の attest
    env:
      PUBLISH: ${{ (github.event_name == 'push' || inputs.publish == true) && 'true' || 'false' }}
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version || 'v0.0.0-dryrun' }}
      IMAGE_BACKEND: ghcr.io/bsj-fujimoto/todo-app-backend
      IMAGE_FRONTEND: ghcr.io/bsj-fujimoto/todo-app-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-npm
        with:
          install: "false"
      - name: 版・タグ・公開の可否を決める
        id: v
        run: |
          if [ "$PUBLISH" = "true" ] && ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::公開する版は vX.Y.Z の形にする（いまは $VERSION）"; exit 1
          fi
          echo "short=${TARGET_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "- 版: \`$VERSION\` / 公開: **$PUBLISH** / 対象 commit: \`$TARGET_SHA\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: GHCR にログインする（公開するときだけ）
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -- backend ----------------------------------------------------------------------------
      - name: backend をビルドして push する（SBOM・provenance mode=max つき）
        id: backend
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ env.VERSION }}
            ${{ env.IMAGE_BACKEND }}:sha-${{ steps.v.outputs.short }}
          build-args: COMMIT_SHA=${{ env.TARGET_SHA }}
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.TARGET_SHA }}
            org.opencontainers.image.version=${{ env.VERSION }}
      - name: backend をビルドする（dry-run。OCI アーカイブに出力。push しない）
        id: backend-dry
        if: env.PUBLISH != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/backend.oci.tar
          build-args: COMMIT_SHA=${{ env.TARGET_SHA }}
          sbom: true
          provenance: mode=max

      # -- frontend ---------------------------------------------------------------------------
      - name: frontend をビルドして push する（SBOM・provenance mode=max つき）
        id: frontend
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:${{ env.VERSION }}
            ${{ env.IMAGE_FRONTEND }}:sha-${{ steps.v.outputs.short }}
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.TARGET_SHA }}
            org.opencontainers.image.version=${{ env.VERSION }}
      - name: frontend をビルドする（dry-run。OCI アーカイブに出力。push しない）
        id: frontend-dry
        if: env.PUBLISH != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/frontend.oci.tar
          sbom: true
          provenance: mode=max

      # -- ダイジェスト固定・provenance・署名 --------------------------------------------------------
      - name: イメージの digest を記録する
        id: digests
        env:
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
          BACKEND_META: ${{ steps.backend.outputs.metadata || steps.backend-dry.outputs.metadata }}
          FRONTEND_META: ${{ steps.frontend.outputs.metadata || steps.frontend-dry.outputs.metadata }}
        run: |
          # push したときは build-push-action の digest。dry-run は metadata の containerimage.digest、
          # 無ければ OCI アーカイブの index.json から取る（どれも無ければ失敗にする）。
          meta_digest() { printf '%s' "$1" | node -e 'const s=require("fs").readFileSync(0,"utf8");process.stdout.write(JSON.parse(s||"{}")["containerimage.digest"]||"")'; }
          oci_digest() { [ -f "$1" ] && tar -xOf "$1" index.json | node -e 'const j=JSON.parse(require("fs").readFileSync(0,"utf8"));process.stdout.write((j.manifests[0]||{}).digest||"")'; }
          backend="${BACKEND_DIGEST:-$(meta_digest "$BACKEND_META")}"
          frontend="${FRONTEND_DIGEST:-$(meta_digest "$FRONTEND_META")}"
          if [ -z "$backend" ]; then backend="$(oci_digest "$RUNNER_TEMP/backend.oci.tar" || true)"; fi
          if [ -z "$frontend" ]; then frontend="$(oci_digest "$RUNNER_TEMP/frontend.oci.tar" || true)"; fi
          if [ -z "$backend" ] || [ -z "$frontend" ]; then echo "::error::イメージの digest を取得できない"; exit 1; fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "- backend: \`$backend\` / frontend: \`$frontend\`" >> "$GITHUB_STEP_SUMMARY"
      - name: provenance（SLSA）を attest する（backend）
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_BACKEND }}
          subject-digest: ${{ steps.digests.outputs.backend }}
          push-to-registry: true
          create-storage-record: false
      - name: provenance（SLSA）を attest する（frontend）
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_FRONTEND }}
          subject-digest: ${{ steps.digests.outputs.frontend }}
          push-to-registry: true
          create-storage-record: false
      - name: cosign を入れる
        if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: cosign で keyless 署名する（OIDC。digest に対して署名する）
        if: env.PUBLISH == 'true'
        env:
          BACKEND_REF: ${{ env.IMAGE_BACKEND }}@${{ steps.digests.outputs.backend }}
          FRONTEND_REF: ${{ env.IMAGE_FRONTEND }}@${{ steps.digests.outputs.frontend }}
        run: |
          cosign sign --yes "$BACKEND_REF"
          cosign sign --yes "$FRONTEND_REF"
      - name: SBOM と provenance（buildx が付けたもの）を保存する
        if: env.PUBLISH == 'true'
        env:
          BACKEND_REF: ${{ env.IMAGE_BACKEND }}@${{ steps.digests.outputs.backend }}
          FRONTEND_REF: ${{ env.IMAGE_FRONTEND }}@${{ steps.digests.outputs.frontend }}
        run: |
          mkdir -p release-evidence/attestations
          docker buildx imagetools inspect "$BACKEND_REF" --format '{{ json .SBOM }}' > release-evidence/attestations/sbom-backend.json
          docker buildx imagetools inspect "$FRONTEND_REF" --format '{{ json .SBOM }}' > release-evidence/attestations/sbom-frontend.json
          docker buildx imagetools inspect "$BACKEND_REF" --format '{{ json .Provenance }}' > release-evidence/attestations/provenance-backend.json
          docker buildx imagetools inspect "$FRONTEND_REF" --format '{{ json .Provenance }}' > release-evidence/attestations/provenance-frontend.json

      # -- 証跡（release-evidence.zip）---------------------------------------------------------------
      - name: CI・セキュリティの結果を集める（この run の artifact）
        if: github.event_name != 'pull_request'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{ci-summary,ci-summary-*,security-findings,security-scan-*,contract-report,docs-check-reports,regression-selection}"
          path: release-evidence
      - name: 性能（k6）の結果があれば集める（最新の成功した perf.yml の run。無ければ無いと記録する）
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p release-evidence/perf
          id="$(gh run list --repo "$REPO" --workflow perf.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty' 2> /dev/null || true)"
          if [ -n "$id" ] && gh run download "$id" --repo "$REPO" --dir release-evidence/perf 2> /dev/null; then
            echo "{\"source_run\":\"$id\"}" > release-evidence/perf/source.json
          else
            echo '{"note":"perf.yml の成功した run が無い（性能の結果は添付しない）"}' > release-evidence/perf/source.json
          fi
      - name: 証跡を仕上げる（デプロイマーカー・リリースノート・manifest）
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BACKEND_DIGEST: ${{ steps.digests.outputs.backend }}
          FRONTEND_DIGEST: ${{ steps.digests.outputs.frontend }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p release-evidence
          flag=""
          if [ "$PUBLISH" = "true" ]; then flag="--publish"; fi
          node scripts/ci/release-evidence.mjs --dir release-evidence --version "$VERSION" --sha "$TARGET_SHA" --repo "$REPO" \
            --run-url "$RUN_URL" --image "backend=$BACKEND_DIGEST" --image "frontend=$FRONTEND_DIGEST" $flag
          (cd release-evidence && zip -qr ../release-evidence.zip .)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-evidence
          path: |
            release-evidence.zip
            release-evidence/RELEASE_NOTES.md
            release-evidence/manifest.json
            release-evidence/deploy-marker.json
          retention-days: 90
          if-no-files-found: error
      - name: GitHub Release を作る（公開するときだけ。release-evidence.zip を添付）
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" release-evidence.zip --repo "${{ github.repository }}" --target "$TARGET_SHA" \
            --title "$VERSION" --notes-file release-evidence/RELEASE_NOTES.md
