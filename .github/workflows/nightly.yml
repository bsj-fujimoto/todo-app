name: Nightly regression

# 日次: 全件・全ブラウザ（毎日 UTC 18:00）
# 週次: 全件を 3 回（unit/api は 3 周、e2e は --repeat-each=3）で回して不安定さ（flaky）を検出（日曜 UTC 20:00）
# 手動: フル回帰（tier を選べる）
# pull_request: このワークフローと回帰運用の道具を変えた PR でだけ、実際に動かして確認する（Issue は作らない）
on:
  schedule:
    - cron: "0 18 * * *"
    - cron: "0 20 * * 0"
  workflow_dispatch:
    inputs:
      tier:
        description: "回帰の層（daily=全件×1 / weekly=全件×3 / full=全件×1 の臨時フル回帰）"
        type: choice
        options: [daily, weekly, full]
        default: full
      create_issues:
        description: "flaky を検出したら Issue を起票する"
        type: boolean
        default: false
  pull_request:
    paths:
      - ".github/workflows/nightly.yml"
      - ".github/actions/**"
      - "scripts/regression/**"
      - "scripts/ci/summarize-junit.mjs"
      - "scripts/ci/lib/**"

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.event.schedule || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

env:
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CI: "true"

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.p.outputs.tier }}
      repeat: ${{ steps.p.outputs.repeat }}
      create_issues: ${{ steps.p.outputs.create_issues }}
    steps:
      - name: 層・繰り返し回数・Issue 起票の要否を決める
        id: p
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          INPUT_TIER: ${{ inputs.tier }}
          INPUT_ISSUES: ${{ inputs.create_issues }}
        run: |
          tier=daily; issues=false
          case "$EVENT" in
            schedule)
              issues=true
              if [ "$CRON" = "0 20 * * 0" ]; then tier=weekly; fi ;;
            workflow_dispatch)
              tier="$INPUT_TIER"; issues="$INPUT_ISSUES" ;;
          esac
          repeat=1
          if [ "$tier" = "weekly" ]; then repeat=3; fi
          {
            echo "tier=$tier"
            echo "repeat=$repeat"
            echo "create_issues=$issues"
          } >> "$GITHUB_OUTPUT"
          echo "- 層: **$tier**（繰り返し ${repeat} 回 / 対象 SHA: \`$TARGET_SHA\` / イベント: $EVENT / Issue 起票: $issues）" >> "$GITHUB_STEP_SUMMARY"

  unit-api:
    name: unit-api
    needs: [plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-npm
      - name: backend・frontend を REPEAT 回（途中で失敗しても残りを回し、最後にまとめて失敗にする）
        env:
          REPEAT: ${{ needs.plan.outputs.repeat }}
        run: |
          fail=0
          for i in $(seq 1 "$REPEAT"); do
            npm run test -w backend || fail=1
            npm run test -w frontend || fail=1
            mkdir -p "results/backend/run-$i" "results/frontend/run-$i"
            cp -R backend/test-results/. "results/backend/run-$i/"
            cp -R frontend/test-results/. "results/frontend/run-$i/"
          done
          exit "$fail"
      - name: 結果を ci-summary にまとめる
        if: always()
        run: |
          node scripts/ci/summarize-junit.mjs --title "nightly unit / api" --out ci-summary-unit-api.json \
            --layer api=results/backend --layer unit=results/frontend --artifact junit=results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-summary-unit-api
          path: ci-summary-unit-api.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-unit-api
          path: results
          retention-days: 90
          if-no-files-found: error

  e2e:
    name: e2e (${{ matrix.project }})
    needs: [plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, browser: chromium }
          - { project: firefox, browser: firefox }
          - { project: webkit, browser: webkit }
          - { project: chromium-mobile-360, browser: chromium }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-npm
      - name: Playwright ブラウザのキャッシュ
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      - name: Playwright ブラウザを入れる
        env:
          BROWSER: ${{ matrix.browser }}
          CACHE_HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            npm exec -w e2e -- playwright install-deps "$BROWSER"
          else
            npm exec -w e2e -- playwright install --with-deps "$BROWSER"
          fi
      - name: E2E 全件（retries=0。週次は --repeat-each=3）
        working-directory: e2e
        env:
          PROJECT: ${{ matrix.project }}
          REPEAT: ${{ needs.plan.outputs.repeat }}
        run: npx playwright test --project="$PROJECT" --retries=0 --repeat-each="$REPEAT"
      - name: 結果を ci-summary にまとめる
        if: always()
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          node scripts/ci/summarize-junit.mjs --title "nightly e2e ($PROJECT)" --out "ci-summary-e2e-$PROJECT.json" \
            --layer e2e=e2e/test-results --artifact e2e-results=e2e/test-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-summary-e2e-${{ matrix.project }}
          path: ci-summary-e2e-${{ matrix.project }}.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-e2e-${{ matrix.project }}
          path: |
            e2e/test-results
            e2e/playwright-report
          retention-days: 90
          if-no-files-found: error

  compose:
    name: compose
    needs: [plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-npm
      - name: Playwright（chromium）を入れる
        run: npm exec -w e2e -- playwright install --with-deps chromium
      - name: compose 結合テスト（週次は --repeat-each=3）
        env:
          REPEAT: ${{ needs.plan.outputs.repeat }}
        run: npm run e2e:compose -- --retries=0 --repeat-each="$REPEAT"
      - name: 結果を ci-summary にまとめる
        if: always()
        run: |
          node scripts/ci/summarize-junit.mjs --title "nightly compose" --out ci-summary-compose.json \
            --layer compose=e2e/test-results --artifact e2e-results=e2e/test-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-summary-compose
          path: ci-summary-compose.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-compose
          path: |
            e2e/test-results
            e2e/playwright-report
          retention-days: 90
          if-no-files-found: error

  # ---- 集計: ci-summary・flaky 検出・選択ロジックの検証・健全性トレンド ------------------------
  report:
    name: report
    if: always()
    needs: [plan, unit-api, e2e, compose]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # 健全性トレンド（workflow runs の読み取り）
    env:
      GH_TOKEN: ${{ github.token }}
      TIER: ${{ needs.plan.outputs.tier }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-node-npm
        with:
          install: "false"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-summary-*
          path: summaries
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: junit-*
          path: junit
      - name: 層別の結果を ci-summary.json に集約する
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          mkdir -p out summaries
          node scripts/ci/summarize-junit.mjs --title "nightly ($TIER)" --merge summaries --out out/ci-summary.json
      - name: flaky を検出する（同一 SHA・同一テストで pass/fail 混在）
        if: always()
        run: node scripts/regression/flaky-report.mjs --junit junit --out out/flaky-report.json
      - name: 選択ロジックの漏れを検証する（直近 10 コミットの変更から選んだケース vs 全件で落ちたケース）
        if: always()
        run: |
          base="$(git rev-parse --verify --quiet HEAD~10 || git rev-list --max-parents=0 HEAD | tail -n 1)"
          node scripts/regression/select.mjs --base "$base" --out out/regression-selection.json
          node scripts/regression/verify-selection.mjs --selection out/regression-selection.json \
            --summary out/ci-summary.json --out out/selection-audit.json
      - name: 健全性トレンド（直近 30 run の成功率・所要時間・連続失敗）
        if: always()
        env:
          REPO: ${{ github.repository }}
        run: |
          node scripts/regression/health-trend.mjs --repo "$REPO" --workflow ci.yml --workflow nightly.yml \
            --limit 30 --out out/health-trend.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: nightly-report-${{ needs.plan.outputs.tier }}
          path: out
          retention-days: 90
          if-no-files-found: error
      - name: 失敗したジョブがあれば、この集計も失敗にする（skipped・cancelled も成功扱いにしない）
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: echo "$NEEDS_JSON" | jq -e 'to_entries | all(.value.result == "success")' > /dev/null

  # ---- flaky の Issue 起票（issues: write はこのジョブだけ）---------------------------------
  file-issues:
    name: file-issues
    if: always() && needs.plan.outputs.create_issues == 'true' && needs.report.result != 'skipped'
    needs: [plan, report]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-npm
        with:
          install: "false"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-report-${{ needs.plan.outputs.tier }}
          path: out
      - name: ラベル flaky の Issue を起票する（同名の open Issue があれば作らない）
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/regression/flaky-issues.mjs --report out/flaky-report.json
