# 外形監視（synthetic）。監視定義は monitoring/monitors.yaml（正本）。実行は scripts/monitoring/run-monitors.mjs。
#   対象: 最新の GHCR リリースイメージ（digest 固定で pull）を compose 起動して localhost に対して実行する。
#         リリースが無い・引けないときは docker compose up --build（main の HEAD）にフォールバックし、run の summary に明記する。
#   起動: 30 分ごと（schedule。宣言 = 設計目標）、main への push（マージ直後）、リリース（Release ワークフロー）の成功後、手動（workflow_dispatch）。
#         GitHub の cron は遅延・欠落しうる。実測（scripts/monitoring/cadence.mjs。monitoring/cadence/）では実効間隔は 3.4〜6.7 時間で、30 分は守れていない。
#         そこで「マージ直後・リリース直後に必ず 1 回動く」契機を足し、MTTD を補う（schedule を置き換えるものではない）。
#         （60 日リポジトリに活動が無いと schedule は無効化される。RB-005 参照）。
#   過剰実行・ループの防止: concurrency group `synthetic`（cancel-in-progress: false）で同時に 1 本だけ動かし、待ちは最新の 1 本に置き換わる
#         （連続マージでも待ちは 1 本）。このワークフローは push もリリースも作らない（Issue・artifact だけ）ので、自分自身を起動しない。
#         workflow_run は Release ワークフローの「push（タグ）で動いて成功した」ときだけ（dry-run・PR は条件で除く）。
#   通知: 失敗は alert ジョブ（issues: write はこのジョブだけ）が incident Issue にする。回復したらコメントして close。
#   通知試験: drill=true で backend コンテナを意図的に止め、アラート経路（Issue 作成・assignee・回復・close）を実際に通す。
#   制約: runner 内の localhost は HTTP のみ。DNS・TLS の実証明書は検証できない（monitoring/README.md、MON-011/012 は enabled: false）。
name: synthetic

on:
  schedule:
    - cron: "7,37 * * * *" # 30 分ごと（宣言。実効は 3.4〜6.7 時間。monitoring/README.md）
  push:
    branches: [main] # マージ直後に 1 回（schedule の遅延・欠落の補完）
  workflow_run:
    workflows: ["Release"] # リリース直後に 1 回（新しいイメージ・Release が監視対象になる）
    types: [completed]
  workflow_dispatch:
    inputs:
      drill:
        description: "通知試験: backend を意図的に停止してアラート経路を通す（drill ラベルの Issue。自動で close）"
        type: boolean
        default: false
      force_fallback:
        description: "リリースイメージを使わず main の HEAD をビルドして監視する"
        type: boolean
        default: false
      meta_drill:
        description: "実行基盤の失敗の通知試験: synthetic ジョブを監視の結果が出る前に意図的に失敗させ、meta-alert（[sev3][MON-META]、drill ラベル）が起票・close することを確かめる"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: synthetic
  cancel-in-progress: false

env:
  OUT: monitoring/out
  DRILL: ${{ inputs.drill && 'true' || 'false' }}
  META_DRILL: ${{ inputs.meta_drill && 'true' || 'false' }}

jobs:
  synthetic:
    # workflow_run は Release が「タグの push で動いて成功した」ときだけ（dry-run・PR・失敗を除く）。他の契機は常に動く
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read # GHCR のリリースイメージを pull する
    outputs:
      # 監視の結果（results.json）が出たか。出ていれば「監視の失敗」（alert ジョブ）、出ていなければ「監視の実行基盤の失敗」（meta-alert ジョブ）
      results_present: ${{ steps.present.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "（通知試験）実行基盤の失敗を注入する"
        if: env.META_DRILL == 'true'
        run: |
          echo "::error::meta_drill: 監視の結果が出る前に意図的に失敗させる（meta-alert の通知試験）"
          exit 1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: node
      - name: "依存を入れる（監視スクリプトは yaml のみ。ブラウザジャーニーは e2e/synthetic の Playwright）"
        run: |
          mise x -- npm ci
          mise x -- npm ci --prefix e2e/synthetic
          mise x -- npx --prefix e2e/synthetic playwright install --with-deps chromium
      - name: "設定の整合性と単体テスト"
        run: |
          mise x -- node scripts/monitoring/check-config.mjs
          mise x -- node --test "scripts/monitoring/test/*.test.mjs"
      - name: "GHCR にログインする"
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: "起動の契機を記録する（schedule / push / workflow_run / 手動）"
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          {
            echo "### 起動の契機"
            echo "- イベント: \`$EVENT_NAME\`（schedule は GitHub の都合で遅延・欠落する。push・workflow_run・手動は契機そのもの）"
            if [ -n "$TRIGGER_RUN_URL" ]; then echo "- きっかけの run: $TRIGGER_RUN_URL"; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: "監視対象を決める（最新リリースのイメージ / フォールバック）"
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_FALLBACK: ${{ inputs.force_fallback && 'true' || 'false' }}
        run: |
          flag=""
          if [ "$FORCE_FALLBACK" = "true" ]; then flag="--force-fallback"; fi
          mise x -- node scripts/monitoring/resolve-target.mjs --out "$OUT" $flag
          mise x -- node scripts/monitoring/target-summary.mjs "$OUT/target.json" >> "$GITHUB_STEP_SUMMARY"
      - name: "起動する（リリースイメージ。ビルドしない）"
        if: steps.target.outputs.mode == 'release'
        run: docker compose -f docker-compose.yml -f "$OUT/compose.release.yml" up -d --no-build --pull always --wait
      - name: "起動する（フォールバック: main の HEAD をビルド）"
        if: steps.target.outputs.mode != 'release'
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: docker compose up -d --build --wait
      - name: "デプロイマーカーを記録する（health の version / commit と最新リリース）"
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise x -- node scripts/monitoring/marker.mjs --base-url http://localhost:8080 --out "$OUT"
      - name: "外形監視を実行する"
        if: env.DRILL != 'true'
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: mise x -- node scripts/monitoring/run-monitors.mjs --base-url http://localhost:8080 --out "$OUT" --target "$OUT/target.json"
      - name: "通知試験（1/3）backend を停止して障害を注入する"
        if: env.DRILL == 'true'
        run: |
          docker compose stop backend
          mise x -- node scripts/monitoring/run-monitors.mjs --base-url http://localhost:8080 --out "$OUT/drill-fail" --phase drill-fail --only MON-002,MON-003 --retry-delay-sec 2 --target "$OUT/target.json"
      - name: "通知試験（2/3）backend を復旧する"
        if: env.DRILL == 'true'
        run: |
          docker compose start backend
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/v1/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
      - name: "通知試験（3/3）復旧を監視で確認する"
        if: env.DRILL == 'true'
        run: mise x -- node scripts/monitoring/run-monitors.mjs --base-url http://localhost:8080 --out "$OUT/drill-recover" --phase drill-recover --only MON-002,MON-003 --target "$OUT/target.json"
      - name: "監視の結果が出たかを記録する（監視の失敗と、実行基盤の失敗を区別する）"
        id: present
        if: always()
        run: |
          if [ -f "$OUT/results.json" ] || [ -f "$OUT/drill-fail/results.json" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi
      - name: "失敗時に compose のログを残す"
        if: failure()
        run: |
          mkdir -p "$OUT"
          docker compose ps > "$OUT/compose-ps.txt" 2>&1 || true
          docker compose logs --no-color --tail 300 > "$OUT/compose-logs.txt" 2>&1 || true
      - name: "結果を保存する（実行履歴・マーカー・失敗時の screenshot / trace。90 日）"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: monitoring-results-${{ github.run_id }}
          path: monitoring/out
          retention-days: 90
          if-no-files-found: warn

  alert:
    needs: synthetic
    # 監視の結果が出たときだけ（監視の失敗は Issue に、成功は回復として close）。実行基盤が失敗して結果が無いときは meta-alert
    if: always() && needs.synthetic.outputs.results_present == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write # incident Issue の作成・コメント・close・ラベル。このジョブだけ
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: node
      - run: mise x -- npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: monitoring-results-${{ github.run_id }}
          path: monitoring/out
      - name: "アラート（失敗 → Issue、回復 → コメントして close、未 ack のエスカレーション）"
        if: env.DRILL != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          mise x -- node scripts/monitoring/alert.mjs --results "$OUT/results.json" --out "$OUT" --escalate --run-url "$url"
          # 監視が最後まで動いた（結果が出た）ので、実行基盤の失敗・停止の incident（MON-META）が open なら回復として close する
          mise x -- node scripts/monitoring/alert.mjs --meta ok --out "$OUT" --run-url "$url"
      - name: "通知試験のアラート（失敗フェーズ → 回復フェーズ。Issue は drill ラベル付き）"
        if: env.DRILL == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          mise x -- node scripts/monitoring/alert.mjs --results "$OUT/drill-fail/results.json" --out "$OUT" --drill --drill-phase fail --run-url "$url"
          mise x -- node scripts/monitoring/alert.mjs --results "$OUT/drill-recover/results.json" --out "$OUT" --drill --drill-phase recover --run-url "$url"
          cat "$OUT/alert-test.md" >> "$GITHUB_STEP_SUMMARY"
      - name: "通知試験の記録を保存する（monitoring/alert-tests.md に転記する）"
        if: always() && env.DRILL == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alert-test-${{ github.run_id }}
          path: |
            monitoring/out/alert-test.json
            monitoring/out/alert-test.md
            monitoring/out/alert-tests.jsonl
            monitoring/out/alert-history.jsonl
            monitoring/out/drill-state.json
          retention-days: 90
          if-no-files-found: warn

  # 監視の実行基盤そのものが失敗した（compose の起動・依存の導入・Playwright の導入などで結果が出なかった）ときの incident。
  # 監視の失敗（アプリの障害）とは区別し、sev3 の MON-META として起票する（RB-005）。結果が出ない = 見逃しの恐れ。
  meta-alert:
    needs: synthetic
    if: always() && needs.synthetic.result == 'failure' && needs.synthetic.outputs.results_present != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # 起票する incident の直前のデプロイ（deployment_ref）に、直近の synthetic 実行のマーカー（artifact）を読む
      issues: write # MON-META の incident Issue の作成・コメント。このジョブだけ
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: node
      - run: mise x -- npm ci
      - name: "実行基盤の失敗を incident にする（[sev3][MON-META]）。meta_drill のときは drill ラベルで起票し、すぐ close する"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          drill=""
          if [ "$META_DRILL" = "true" ]; then drill="--drill"; fi
          mise x -- node scripts/monitoring/alert.mjs --meta fail $drill --out monitoring/out \
            --detail "synthetic ジョブが監視の結果を出す前に失敗した（実行基盤の失敗。失敗したステップは run を参照: $url）" \
            --run-url "$url"
          if [ "$META_DRILL" = "true" ]; then
            sleep 20 # 作成直後の Issue が一覧に載るのを待つ
            mise x -- node scripts/monitoring/alert.mjs --meta ok --drill --out monitoring/out --run-url "$url"
          fi
