# 依存の更新（Dependabot version updates）。脆弱性のある依存の更新（security updates）は repo-settings.json で別に有効にする。
# 対象: npm（ルートの workspaces と backend / frontend / e2e、workspace でない e2e/synthetic・perf/screen）・GitHub Actions（SHA 固定のまま追従）・Docker（ベースイメージ）・docker compose。
# 全マニフェスト（package.json・Dockerfile・compose・composite action）を覆っていることは、scripts/security/check-policy.mjs が追跡ファイルの一覧と照合して検査する（漏れは CI が失敗）。
# 週次（月曜 03:00 JST）、グループ化、reviewers / assignees / labels あり。更新の PR も CI（ci-result・security-result）を通す。
version: 2

updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/backend"
      - "/frontend"
      - "/e2e"
      - "/e2e/synthetic" # 外形監視（workspace ではない。独自の lock）
      - "/perf/screen" # 画面計測（lighthouse・playwright-core。workspace ではない。独自の lock）
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3 # 公開直後の版（取り下げ・乗っ取りの確率が高い）をすぐ取り込まない
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    reviewers: [bsj-fujimoto]
    assignees: [bsj-fujimoto]
    labels: [dependencies, npm]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/setup-node-npm"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns: ["*"]
    reviewers: [bsj-fujimoto]
    assignees: [bsj-fujimoto]
    labels: [dependencies, github-actions]
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: docker
    directories:
      - "/backend"
      - "/frontend"
      - "/perf/screen" # mcr.microsoft.com/playwright。版は playwright-core（perf/screen/package.json）と同じにそろえる（check-policy が検査）
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    # Node は LTS の 24 系に固定する（mise.toml・ADR-0003 と一致）。minor / patch だけ追従し、major（25 など）は提案しない。
    # 次の LTS（26 系）への移行は、日付を決めて手動で行う（versions 指定は docker の node に効かなかったため update-types で止める。#27・#58）。
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      docker-base-images:
        patterns: ["*"]
    reviewers: [bsj-fujimoto]
    assignees: [bsj-fujimoto]
    labels: [dependencies, docker]
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: docker-compose
    directories:
      - "/"
      - "/perf" # perf/compose.perf.yml
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    reviewers: [bsj-fujimoto]
    assignees: [bsj-fujimoto]
    labels: [dependencies, docker]
    commit-message:
      prefix: "chore(docker)"
