# テストの結果に影響しない変更（ドキュメント・仕様書・テンプレート）。選択実行では smoke だけを動かし、docs-check で整合を検査する。
# docs/data/cases.csv が変わったときは build-suite の --check（回帰スイート台帳の再生成漏れ）が検出する。
no_test_impact:
  - id: docs
    reason: ドキュメント（docs-check で ID 参照・リンク・manifest を検査する）
    paths:
      - "docs/**"
      - "**/*.md"
  - id: spec
    reason: 仕様書（実装の変更は別 PR で行い、そちらで影響を選ぶ）
    paths:
      - "spec/**"
  - id: repo-meta
    reason: リポジトリのメタ情報（所有者・テンプレート・エディタ設定・ライセンス）
    paths:
      - ".github/CODEOWNERS"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".editorconfig"
      - ".gitignore"
      - "LICENSE"
