# 変更影響マップ: 変更ファイル（パスの glob）→ 影響する機能 → 実行する TC-ID。
# 使われ方:
#   - scripts/regression/select.mjs が PR の変更ファイルから実行するケースを選ぶ（PR 層）。
#   - どのエントリにも当たらないパスが 1 つでもあれば、選択せず全件実行にフォールバックする。
#   - scripts/regression/impact-check.mjs が「追跡ファイルのすべてがどれかに当たる」「全自動ケースがどれかから選ばれる」
#     ことを CI で検査する（マップの陳腐化を防ぐ）。
# 保守ルール: ファイルを足す・機能を足す PR で、この表も更新する。迷ったら広く書く（選びすぎは安全、外しすぎは漏れ）。
#   excluded_risk には「このエントリだけで選んだときに検証されなくなるもの」を書く（選択実行の限界を明示する）。
version: 1
smoke_case_ids: [TC-001, TC-030, TC-056, TC-075, TC-076] # 主要フロー・入力検証・初期画面・ヘルス・compose 起動。変更内容に関わらず毎回実行する。
