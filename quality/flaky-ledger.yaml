# flaky（不安定）テストの隔離台帳。空で開始する（現時点で隔離しているテストは無い）。
# 運用ルールは quality/README.md。ここに書く = 「隔離している」ことの公開宣言であり、書けば許されるわけではない。
#   - 隔離は期限付き（since から 30 日以内）。期限が切れたら CI（docs-check）が失敗する。
#   - retry で隠さない（retries の指定は不可）。隔離とは「ゲートから外して原因を直す」こと。
#   - 隔離中も毎日の回帰（nightly）では実行し、結果を記録する。
# 書式（entries の各要素。すべて必須）:
#   - test_id: TC-045            # ケース ID（またはテスト名）
#     rate: 0.12                 # 観測した失敗率（失敗数 / 実行数）
#     cause: タイミング依存（保存エラー表示を待たずに assert している）   # 原因の分類と内容
#     owner: フロントエンド担当    # 直す責任者（ロール）
#     since: 2026-10-11          # 隔離を始めた日
#     expires_at: 2026-11-10     # 期限（since + 30 日以内）。過ぎる前に直すか、理由付きで更新する
#     issue: "#123"              # 追跡する Issue（任意）
version: 1
entries: []
