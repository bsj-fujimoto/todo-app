# flaky（不安定）テストの台帳。空で開始し、実際に混在（pass/fail）を観測したものだけを、期限付きで書く。
# 運用ルールは quality/README.md。ここに書く = 「隔離している」ことの公開宣言であり、書けば許されるわけではない。
#   - 隔離は期限付き（since から 30 日以内）。期限が切れたら CI（docs-check）が失敗する。
#   - retry で隠さない（retries の指定は不可）。隔離とは「ゲートから外して原因を直す」こと。
#   - 隔離中も毎日の回帰（nightly）では実行し、結果を記録する。
# 書式（entries の各要素。すべて必須）:
#   - test_id: TC-045            # ケース ID（またはテスト名）
#     rate: 0.12                 # 観測した失敗率（失敗数 / 実行数）
#     cause: タイミング依存（保存エラー表示を待たずに assert している）   # 原因の分類と内容
#     owner: フロントエンド担当    # 直す責任者（ロール）
#     since: 2026-10-11          # 隔離を始めた日
#     expires_at: 2026-11-10     # 期限（since + 30 日以内）。過ぎる前に直すか、理由付きで更新する
#     issue: "#123"              # 追跡する Issue（任意）
version: 1
entries:
  - test_id: TC-073
    rate: 0.1
    cause: 絶対時間のしきい値（追加 p95 300ms）を、負荷が変わる共有ランナーで判定している（観測 452ms）。対策済み（CI はしきい値 3 倍＝一覧 1500ms・追加 900ms。SLO の本判定は perf 層の perf/slo.yaml）。週次の --repeat-each=3 で混在が無いことを確認できたら台帳から外して #25 を閉じる
    owner: バックエンド担当
    since: 2026-10-11
    expires_at: 2026-11-10
    issue: "#25"
  - test_id: TC-074
    rate: 0.1
    cause: 環境差（共有ランナーの負荷）と計測の粒度。絶対時間のしきい値（各操作 1000ms）を機能テスト層で判定していた（run 38140205187 で追加が 1054ms。CI の通常値は 追加 287〜411ms）。対策済み（CI はしきい値 3 倍＝表示完了 6000ms・各操作 3000ms。ローカルは従来値。SLO の本判定は perf 層の perf/slo.yaml）。週次の --repeat-each=3 で混在が無いことを確認できたら台帳から外して #37 を閉じる
    owner: フロントエンド担当
    since: 2026-10-11
    expires_at: 2026-11-10
    issue: "#37"
