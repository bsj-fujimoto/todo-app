# 「自動化するはずのケースで、対応するテストがまだ無い」ものを、期限付きで公開する台帳。
# scripts/ci/docs-check.mjs が読む。ここに無い自動化ケースがテストに対応していなければ CI が失敗する。
#   - 理由・owner・期限（expires_at）は必須。期限が切れたら CI が失敗する（放置させない）。
#   - テストを足したら、この台帳から外す（外し忘れは docs-check が警告する）。
# 書式:
#   - test_case_id: TC-074
#     reason: 性能のしきい値が暫定（UNK-005 の決定待ち）で、期待値を固定できない
#     owner: QA リード
#     expires_at: 2026-11-15
version: 1
gaps: []
