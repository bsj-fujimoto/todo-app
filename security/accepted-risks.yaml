# 期限付きで受容しているリスク。受容 = 「いまは直さない」と決めて期限を切ること。放置の言い換えではない。
# 規則（security/README.md）:
#   - critical は受容できない（直す）。high は 30 日以内、medium は 90 日以内の期限。期限が切れると未解決に戻り、ゲートで失敗する。
#   - 受容には理由・owner（ロール）・受容日・期限・再検査条件が要る。medium は追跡 Issue を issue に書く。
#   - 直したら、この台帳から外す（triage.mjs が「どの検出にも当たらない」と注意を出す）。
# 書式:
#   - id: AR-001
#     match:                      # 検出への当て方（tool / scan / rule_id / component / location / category。指定した項目がすべて一致）
#       tool: trivy
#       rule_id: CVE-2026-0000
#       component: some-package
#     reason: なぜ今は直さないか（到達可能性・補完統制を含めて）
#     owner: バックエンド担当
#     accepted_at: 2026-10-11
#     expires_at: 2026-11-10
#     reverify_condition: 修正版が出たとき / 期限の 7 日前
#     issue: "#12"
#     reachability: 到達不能（理由）
#     exposure: 内部のみ / 外部公開
#     asset_impact: 低 / 中 / 高（理由）
#     compensating_controls: 補完統制
# 受容は下の entries。AR-001（zlib CVE-2026-85091）は、両 Dockerfile で zlib を修正版 1.3.2-r1 に上げて是正したので外した（2026-10-12、trivy image で検出 0 件を確認）。
# 未解決の medium が出たら、ここに期限付きで書くか、直す。
version: 1
entries:
  - id: AR-002
    match:
      tool: codeql
      rule_id: js/http-to-file-access
      location: "scripts/monitoring/run-monitors.mjs"
    recommendation: 結果ファイル（results.json）へ書く値は、書込み前に scripts/monitoring/lib/scrub.mjs で検証・正規化している（数値は有限の数、文字列は印字文字と 200 字まで、キーは許可した形）。CodeQL がなおこのデータフローを追跡するなら、書く項目を固定のスキーマに写してから書く
    alternative: 書込みをやめて標準出力と Step Summary だけにする（失敗の証跡が artifact に残らなくなるので採らない）。または失敗詳細を書かず、監視 ID と結果だけにする（原因の調査ができなくなる）
    reason: >-
      外形監視の結果ファイル（results.json）に、監視の失敗詳細として測定対象（自分たちの backend）の応答に由来する文字列を書く。これは証跡が目的で、
      除去すると失敗の原因が残らない。書込み先は固定のパス（--out）で、書いた内容を実行・解釈する経路は無い（保存するだけ。読むのは JSON.parse のみ）。
    owner: SRE 担当
    accepted_at: 2026-10-11
    expires_at: 2027-01-09
    reverify_condition: 結果ファイルへ書く文字列の長さ上限・制御文字の除去を共通化したとき / 期限の 7 日前
    issue: "#33"
    reachability: なし（書いたファイルを実行・解釈しない）
    exposure: CI の作業ディレクトリと artifact（90 日）。外部に公開しない
    asset_impact: 低（測定対象の応答の文字列が結果ファイルに入るだけ）
    compensating_controls: Markdown の要約は `|` と `\` をエスケープ。応答の検証は契約（スキーマ）で行い、失敗詳細に引用する値は 80 文字で切り詰める
  - id: AR-003
    match:
      tool: codeql
      rule_id: js/http-to-file-access
      location: "perf/screen/measure.mjs"
    recommendation: screen.json へ書く値は、書込み前に perf/screen/scrub.mjs で検証・正規化している（数値は有限の数、文字列は印字文字と 200 字まで、キーは許可した形）。CodeQL がなおこのデータフローを追跡するなら、書く項目を固定のスキーマに写してから書く
    alternative: 計測値を標準出力だけにして artifact に残さない（性能の証跡が残らなくなるので採らない）
    reason: >-
      画面計測（Docker イメージの中で動く）が、計測値（ブラウザの Navigation Timing・Lighthouse・一覧 API の件数）を screen.json に書く。
      計測値の保存が目的で、書込み先は固定の /out。書いた内容を実行・解釈する経路は無い。
    owner: SRE 担当
    accepted_at: 2026-10-11
    expires_at: 2027-01-09
    reverify_condition: 保存する値を数値と検証済みの文字列に限定する整理を入れたとき / 期限の 7 日前
    issue: "#33"
    reachability: なし（保存するだけ）
    exposure: 計測用のコンテナ（非 root、compose の内部ネットワークのみ）と CI の artifact。外部に公開しない
    asset_impact: 低（計測値の保存）
    compensating_controls: コンテナは非 root（uid 1001）・一度きりの実行。保存する値の大半は数値
