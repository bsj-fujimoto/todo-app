# 期限付きで受容しているリスク。受容 = 「いまは直さない」と決めて期限を切ること。放置の言い換えではない。
# 規則（security/README.md）:
#   - critical は受容できない（直す）。high は 30 日以内、medium は 90 日以内の期限。期限が切れると未解決に戻り、ゲートで失敗する。
#   - 受容には理由・owner（ロール）・受容日・期限・再検査条件が要る。medium は追跡 Issue を issue に書く。
#   - 直したら、この台帳から外す（triage.mjs が「どの検出にも当たらない」と注意を出す）。
# 書式:
#   - id: AR-001
#     match:                      # 検出への当て方（tool / scan / rule_id / component / location / category。指定した項目がすべて一致）
#       tool: trivy
#       rule_id: CVE-2026-0000
#       component: some-package
#     reason: なぜ今は直さないか（到達可能性・補完統制を含めて）
#     owner: バックエンド担当
#     accepted_at: 2026-10-11
#     expires_at: 2026-11-10
#     reverify_condition: 修正版が出たとき / 期限の 7 日前
#     issue: "#12"
#     reachability: 到達不能（理由）
#     exposure: 内部のみ / 外部公開
#     asset_impact: 低 / 中 / 高（理由）
#     compensating_controls: 補完統制
# 受容は下の entries。AR-001（zlib CVE-2026-85091）は、両 Dockerfile で zlib を修正版 1.3.2-r1 に上げて是正したので外した（2026-10-12、trivy image で検出 0 件を確認）。
# AR-003（画面計測 perf/screen/measure.mjs の js/http-to-file-access）は、応答に由来する一覧の件数をそのまま書かず、期待した件数と一致したかだけを書く形に直して外した（2026-10-12）。
# 未解決の medium が出たら、ここに期限付きで書くか、直す。
version: 1
entries:
  - id: AR-002
    match:
      tool: codeql
      rule_id: js/http-to-file-access
      location: "scripts/monitoring/run-monitors.mjs"
    recommendation: 結果ファイルへ書く値のうち、応答に由来する文字列は書込み前に scripts/monitoring/lib/scrub.mjs で検証・正規化している（文字列は印字文字と 200 字まで、キーは許可した形）が、CodeQL はこの検証を浄化として認識しない（CodeQL の追跡は health 応答の version・commit 文字列〔run.version〕から results.json の書込みまで残る）。除去するには、version を結果に書かず、期待した版（deployment-markers・target.json）との一致だけを書くことになる
    alternative: version を results.json に書かず、期待した版との一致（真偽）だけにする（alert.mjs・runbook が版を引用するので、不一致のときに実際の版が Issue に載らなくなる）。または書込みをやめて標準出力と Step Summary だけにする（失敗の証跡が artifact に残らなくなる）
    reason: >-
      外形監視の結果ファイル（results.json）に、監視の失敗詳細として測定対象（自分たちの backend）の応答に由来する文字列（失敗詳細・health の版と commit）を書く。これは証跡が目的で、
      除去すると失敗の原因や、障害時にどの版だったかが残らない。書込み先は固定のパス（--out）で、書いた内容を実行・解釈する経路は無い（保存するだけ。読むのは JSON.parse のみ）。
    owner: SRE 担当
    accepted_at: 2026-10-11
    expires_at: 2027-01-09
    reverify_condition: CodeQL が scrub.mjs 相当の検証を浄化として扱うようになったとき / 版を期待した版との一致だけに変える判断をしたとき / 期限の 7 日前
    issue: "#33"
    reachability: なし（書いたファイルを実行・解釈しない）
    exposure: CI の作業ディレクトリと artifact（90 日）。外部に公開しない
    asset_impact: 低（測定対象の応答の文字列が結果ファイルに入るだけ）
    compensating_controls: Markdown の要約は `|` と `\` をエスケープ。応答の検証は契約（スキーマ）で行い、失敗詳細に引用する値は 80 文字で切り詰める
