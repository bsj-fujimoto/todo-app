# セキュリティ検出のトリアージ台帳（人が書く）。scripts/security/triage.mjs が検出に突き合わせ、security/findings.json の元にする。
# 機械が決めるのは「重複（同じ勧告 × 同じ部品）・前回との差分・ゲート」だけで、真偽や文脈はここに書かれたものを写す。機械は作り話を足さない。
#
# 状態（status）: tp 真陽性（要是正）/ fp 誤検出 / na 該当しない（このアプリでは起こらない）/ dup 重複（手動）。
#   accepted は accepted-risks.yaml に書く。fixed は「前回あったが今回無い」ことを機械が判定する。何も書かれていない検出は untriaged のまま残る。
# 必須: すべての status に reason。tp には recommendation（修正方法）・owner（ロール）・due・reverify_condition も必須。
# 任意（書けるものは書く。インパクトの判断材料になる）:
#   reachability（到達可能性）/ exposure（公開範囲）/ asset_impact（資産影響）/ compensating_controls（補完統制）/ alternative（代替案）/ issue
# 書式:
#   - match:
#       tool: trivy
#       rule_id: CVE-2026-0000
#       component: some-package     # 任意。location は glob（行番号は無視）
#     status: fp
#     reason: 誤検出の根拠
#     reachability: 到達不能（このコードパスを使わない）
#     exposure: 内部のみ
#     asset_impact: なし
#     compensating_controls: 入力は frontend の検証と backend の検証で二重に弾く
#     decided_by: セキュリティ担当
#     decided_at: 2026-10-11
# 現時点で人の判断が必要な検出は、実行結果（security-findings の findings.json）を見て追記する。
version: 1
entries:
  - match:
      tool: owasp-zap
      rule_id: "10049-3"
    status: tp
    reason: API の応答（/api/v1/tasks・/api/v1/health）に Cache-Control が無く、共有キャッシュ・ブラウザに保存されうる。タスク一覧は更新が即時に見えるべきデータで、古い一覧が出ると誤表示になる。重大度は info（機密データは含まない）。
    reachability: 到達可能（認証の無い公開 API。誰でも GET できる）
    exposure: frontend の公開ポート（8080）経由。社外公開の想定は無い（ローカル・社内の検証用）
    asset_impact: 低（タスクの一覧は個人用で機密ではない。影響は古いデータの表示）
    compensating_controls: 静的ファイルは expires -1 で毎回再検証させている。API の応答はブラウザの既定ではヒューリスティックキャッシュに入りにくい
    recommendation: backend の応答に Cache-Control no-store を付ける（backend/src/http か app.js の onSend フック）。OpenAPI の契約には影響しない（ヘッダの追加のみ）
    alternative: frontend の nginx で /api/ の location に proxy_hide_header と add_header を足す（ただし location で add_header を書くとセキュリティヘッダの継承が切れるので、全ヘッダを書き直す必要がある）
    owner: バックエンド担当
    due: 2026-12-31
    reverify_condition: backend に Cache-Control を付けたあと security.yml の ZAP 走査で 10049 が消えること
    decided_by: セキュリティ担当
    decided_at: 2026-10-11
  - match:
      tool: owasp-zap
      rule_id: "100000-*"
    status: na
    reason: ZAP の探索リクエスト（存在しない URL・不正な入力・誤ったメソッド）に対し、サーバーが仕様どおり 4xx で拒否したことの記録（info）。異常ではなく、期待する防御の挙動。
    reachability: 該当しない（脆弱性ではない）
    exposure: 該当しない
    asset_impact: なし
    compensating_controls: 入力検証（TC-010〜012・TC-030〜036）と 404 の応答（TC-011）がテストで固定されている
    decided_by: セキュリティ担当
    decided_at: 2026-10-11
    recommendation: 修正しない（脆弱性ではなく、ZAP の探索リクエストを backend が仕様どおり 4xx で拒否した事実の記録）。代替統制は、入力検証と 404 の応答をテストで固定していること（TC-010〜012・TC-030〜036）
    alternative: security/zap-rules.tsv で IGNORE（理由・owner・期限つき）にして、ノイズとして出さない。ただし拒否が働いていることの記録も消えるので、台帳（na）での扱いを優先している
    owner: セキュリティ担当
    due: 2027-01-09
    reverify_condition: ZAP のバージョンを上げたとき / API のエラー応答（openapi.yaml の Error・TitleInvalid）を変えたとき / 期限
  - match:
      tool: owasp-zap
      rule_id: "100001"
    status: na
    reason: 存在しないパス（ZAP の SSRF 探索の /computeMetadata/ や /latest/ など）に対し、/api 以外は nginx の既定の HTML 404 を返すため「予期しない Content-Type」と判定された（low）。/api 以外は静的ファイルの配信だけで、攻撃面にならない。
    reachability: 該当しない（404 の本文は固定の HTML で、入力を反映しない）
    exposure: frontend の公開ポート（8080）
    asset_impact: なし
    compensating_controls: nginx は server_tokens off。404 は入力を反映しない。API のエラーは JSON（openapi.yaml の Error スキーマ）
    decided_by: セキュリティ担当
    decided_at: 2026-10-11
    recommendation: 修正しない（/api 以外の存在しないパスの 404 は nginx の既定の HTML で、入力を反映しない。攻撃面にならない）。代替統制は server_tokens off と、404 の本文が固定であること
    alternative: frontend/nginx.conf に error_page 404 を JSON で返す location を足し、Content-Type を API とそろえる（HTML 画面の 404 の見た目は変わる。画面側の 404 表示は現状無い）
    owner: フロントエンド担当
    due: 2027-01-09
    reverify_condition: nginx.conf の error_page・location を変えたとき / ZAP のバージョンを上げたとき / 期限
  - match:
      tool: owasp-zap
      rule_id: "10109"
    status: na
    reason: ZAP が画面を「モダンな Web アプリ」と判定しただけの情報（info）。脆弱性ではなく、AJAX スパイダーを使う目安の通知。
    reachability: 該当しない
    exposure: 該当しない
    asset_impact: なし
    compensating_controls: 該当しない
    decided_by: セキュリティ担当
    decided_at: 2026-10-11
    recommendation: 修正しない（脆弱性ではなく、ZAP が AJAX スパイダーの利用を勧める情報の通知）。代替統制は、API 走査（openapi.yaml の全 operation）で API 側の面を網羅していること
    alternative: ZAP の AJAX スパイダーを追加して画面側の走査範囲を広げる（画面は 1 ページで、得られる情報は少ない。実行時間は増える）
    owner: セキュリティ担当
    due: 2027-01-09
    reverify_condition: 画面のページ数・機能が増えたとき / ZAP のバージョンを上げたとき / 期限
  - match:
      tool: compose-check
      rule_id: COMPOSE-006
    status: na
    reason: docker-compose.yml の frontend は 8080 を全インターフェースで公開する。これはローカル・社内の検証用の構成で、利用者が自分の端末で http://localhost:8080 を開くための意図した公開。外部公開の本番環境は無い（SECURITY.md）。公開先を絞りたい場合は FRONTEND_PORT の代わりに 127.0.0.1:8080:8080 とする。
    reachability: 到達可能（意図したもの）
    exposure: 検証用の端末・社内ネットワーク
    asset_impact: 低（個人用の ToDo。認証・機密データなし）
    compensating_controls: 非 root・cap_drop ALL・セキュリティヘッダ・入力検証。backend のポートはホストへ公開しない
    reverify_condition: 本番環境に出すとき（その時点で、公開範囲・認証・TLS を設計する）
    decided_by: セキュリティ担当
    decided_at: 2026-10-11
    recommendation: 修正しない（ローカル・社内の検証用の意図した公開。本番環境は無い）。公開先を絞りたい端末では、compose の ports を 127.0.0.1:8080:8080 にする。代替統制は非 root・cap_drop ALL・セキュリティヘッダ・入力検証
    alternative: docker-compose.yml の ports を `127.0.0.1:${FRONTEND_PORT:-8080}:8080` にする（同じ端末からだけ確認できる。社内の別端末からは見えなくなる）
    owner: セキュリティ担当
    due: 2027-01-09
  - match:
      tool: owasp-zap
      rule_id: "10049-1"
    status: na
    reason: 「保存されない内容（Non-Storable Content）」の記録（info）。POST・PATCH・DELETE の応答などが共有キャッシュに保存されないという、望ましい状態の通知で、脆弱性ではない。
    reachability: 該当しない
    exposure: 該当しない
    asset_impact: なし
    compensating_controls: 該当しない
    decided_by: セキュリティ担当
    decided_at: 2026-10-11
    recommendation: 修正しない（POST・PATCH・DELETE の応答が共有キャッシュに保存されないという望ましい状態の通知で、脆弱性ではない）
    alternative: ZAP のルール 10049 の一部を zap-rules.tsv で IGNORE にする（同じ 10049 の 10049-3 は実際の指摘なので、ルール全体は無効にしない）
    owner: セキュリティ担当
    due: 2027-01-09
    reverify_condition: backend の Cache-Control の方針を変えたとき（10049-3 の是正時に再確認）/ 期限
  - match:
      tool: owasp-zap
      rule_id: "10049-2"
    status: na
    reason: 「保存はできるが再利用されない内容」（info）。対象は静的ファイルと存在しないパスの 404 で、機密を含まず、expires -1 で毎回再検証させている。
    reachability: 該当しない（機密データを含まない）
    exposure: frontend の公開ポート（8080）
    asset_impact: なし
    compensating_controls: 静的ファイルは expires -1 で毎回再検証
    decided_by: セキュリティ担当
    decided_at: 2026-10-11
    recommendation: 修正しない（静的ファイルと 404 は機密を含まず、expires -1 で毎回再検証させている。保存はできても再利用されない）
    alternative: nginx で静的ファイルに Cache-Control に no-cache を明示する（現状の expires -1 でも再検証は効いている。ヘッダが増える）
    owner: セキュリティ担当
    due: 2027-01-09
    reverify_condition: nginx.conf のキャッシュ設定を変えたとき / ZAP のバージョンを上げたとき / 期限
  - match:
      tool: gitleaks
      rule_id: sourcegraph-access-token
      location: "docs/**"
    status: fp
    reason: FND-012。sourcegraph-access-token は「キーワード（sourcegraph / sgp_）を含むファイルの中の 40 桁の 16 進」に当たる。docs/evidence（取り込んだ証跡）と docs/data（生成した表）は commit の SHA（40 桁の 16 進）を必ず含み、gitleaks 自身の検出ルール名（検出の記録そのもの）も含むので、キーワードと SHA が同じファイルに入って自己参照的に当たる。トークンではない（PR #42 で確認）。同じ範囲は security/gitleaks.toml の allowlist（targetRules を sourcegraph-access-token に限定、paths は docs/evidence と docs/data）で除外しており、他のルールは docs/ 以下にも適用したまま。
    reachability: 該当しない（秘密情報ではなく、commit の SHA と検出ルール名）
    exposure: 該当しない（証跡は公開リポジトリの docs/ にあるが、含まれるのは SHA だけ）
    asset_impact: なし
    compensating_controls: security/gitleaks.toml の allowlist は理由つきで、ルールとパスを限定している。他のルール（aws・github トークンなど）は docs/ にも適用している
    reverify_condition: gitleaks のルールが変わったとき、または証跡の形式（docs/evidence・docs/data）が変わったとき
    owner: セキュリティ担当 # ACT-010 の owner と同じ（fp は owner・due 必須ではないが、確認の担当と期限を台帳に持たせる）
    due: 2026-10-19 # ACT-010 の期限と同じ（allowlist の効果をマージ後の security.yml で確かめる日）
    decided_by: セキュリティ担当
    decided_at: 2026-10-12
    recommendation: 是正は不要（誤検出）。再発を避けるため、security/gitleaks.toml の allowlist（targetRules を sourcegraph-access-token に限定、paths は docs/）を理由つきで維持する。他のルールは docs/ にも適用したまま
    alternative: docs/ の SHA 表記を、キーワード（sourcegraph）と同じファイルに置かない書き方に直す（文書の自然な記述を変えることになり、ルールの性質上、自己参照的に当たるものは残る）
  - match:
      tool: qc-inspect
      rule_id: long-function
      location: "backend/test/helpers/harness.js"
    status: tp
    reason: qc の内蔵検査（inspect）が createHarness（約 60 行）を long-function（low）として指摘している。事実として長い。テストの行数の規約（max-lines-per-function）はテストで緩めているが、それとは別に、分けたほうが読みやすい。直さずに残している理由は、API 結果表（docs/data/api-results.csv）が backend/test/helpers/harness.js を含む実装を「結果を取った commit（docs/evidence/release.json の v1.0.0）から変わっていないこと」を前提にしており（scripts/evidence/build-api-results.mjs の IMPLEMENTATION）、いま書き換えると v1.0.0 の API 結果の証跡が別の版になって docs-check が失敗するため。
    reachability: 該当しない（テスト基盤の読みやすさの指摘。製品の動作に影響しない）
    exposure: 該当しない
    asset_impact: 低（保守性）
    compensating_controls: ESLint の complexity ≤ 8・引数 ≤ 4・ネスト ≤ 3 は適用済み。createHarness の各メソッドは単一の責務（sandbox・start・cleanup）
    recommendation: 次のリリースで API の結果を取り直すとき（release.json を更新するとき）に、createHarness から start の中身（startApp）を切り出して 40 行以内にする。同時に eslint.config.js の backend/test-support の override（no-promise-executor-return）も外す
    alternative: qc の指摘を受け入れず、テストの行数の緩和を恒久の規約として残す（テストは describe/it の入れ子で長くなりやすい。ただし harness は入れ子ではなく実際に分けられるので、採らない）
    owner: バックエンド担当
    due: 2027-01-09
    reverify_condition: docs/evidence/release.json を更新する（API の結果を取り直す）とき / 期限
    decided_by: セキュリティ担当
    decided_at: 2026-10-12
