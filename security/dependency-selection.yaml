      - nginx:stable-alpine（root で動く。非 root 化の設定が増える）
      - caddy / busybox httpd（設定の実績が少ない・機能が足りない）
    maintenance: nginx 社が保守する公式の派生イメージ。更新は Dependabot（docker）と trivy image で追う。
    handling: 継続利用。
