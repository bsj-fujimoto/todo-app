    maintenance: Docker Official Images（Node.js チームが保守）。Node 24 は LTS。ベースイメージの更新は Dependabot（docker）が週次で提案し、trivy image が脆弱性を検査する。
    handling: 継続利用。
    last_checked: 2026-10-11
  - name: nginxinc/nginx-unprivileged:stable-alpine（Docker ベースイメージ。frontend）
    version: stable-alpine@sha256:15c994d10d6d78658721c3bcafff14cb281fba2a4bdf9d5ba92c416a472516e3
    workspace: frontend
    kind: base-image
    reason: 非 root（8080）で動く nginx の公式（nginx 社）イメージ。静的配信と /api の中継だけをする。tag + digest で固定する。
