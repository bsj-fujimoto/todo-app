identifiers: # glob 風の形（qc-analyzer が ID の形を検査するのに使う）。形の詳細は forms
  requirement: "REQ-*"
  risk: "RISK-*"
  perspective: "VIEW-*"
  test_case: "TC-*"
  execution: "EXEC-*"
  defect: "DEF-*"
  finding: "FND-*"
  action: "ACT-*"
  unknown: "UNK-*"
  dataset: "DS-*"
  evidence: "EV-*"
  artifact: "ART-*"
  forms:
    REQ: "REQ-001（3 桁。docs/data/requirements.csv）"
    RISK: "RISK-001（docs/data/risks.csv）"
    VIEW: "VIEW-001（docs/data/perspectives.csv）"
    TC: "TC-001（docs/data/cases.csv。テスト名の先頭にも付ける）"
    EXEC: "EXEC-0001（4 桁。docs/data/executions.csv。1 行 = 1 ケース × 1 環境の実施）"
    DEF: "DEF-005（= GitHub Issue 番号 3 桁。正本は Issue、docs/data/defects.csv は写し）"
    FND: "FND-001（security.yml の triage の F-nnn を写したもの。docs/data/findings.csv。安定識別は fingerprint）"
    ACT: "ACT-001（docs/data/actions.csv）"
    UNK: "UNK-001（docs/data/unknowns.csv）"
    DS: "DS-001（docs/data/datasets.csv）"
    EV: "EV-0001（4 桁。docs/data/evidence-index.csv）"
    ART: "ART-01（2 桁。成果物台帳 docs/evidence/artifacts.yaml）"
    J: "J-01（重要ユーザージャーニー。quality/journeys.yaml）"
    MON: "MON-001（外形監視。monitoring/monitors.yaml）"
    AC: "AC-01〜AC-07（受け入れ条件。spec/todo-phase1-spec.html §06）。AC-08〜AC-17 はフェーズ2仕様で v1.0.0 の対象外"
    EXC: "EXC-001（承認済み対象外。本ファイルの exceptions）"
    C: "C-001（食い違い。本ファイルの contradictions）"
  chain: "REQ → RISK → VIEW → TC → EXEC → DEF（→ FND / ACT）。EV が主張ごとに証拠へ紐づく。docs/data/traceability.csv が追跡表"

# ---------------------------------------------------------------------------------------------
strategy:
  regression: # 実態: quality/README.md、.github/workflows/{ci,nightly,release}.yml
    ref: quality/README.md
    pr_tier:
      - "@smoke を常時（TC-001）"
      - "変更影響で選択した unit / api / e2e / contract / compose（quality/impact-map.yaml）。マップに無いパスの変更・差分が空・full: true のエントリは全件にフォールバック"
    daily_tier:
      - "毎日 UTC 18:00（nightly.yml）。全件・全ブラウザ（e2e 4 project）・compose"
      - "main push は全件（ci.yml）"
    release_tier:
      - "タグ v*.*.*（release.yml）。全件 + compose + セキュリティ + 証跡検査（+ 性能があれば）。失敗したらリリースしない"
      - "週次: 日曜 UTC 20:00。全件を 3 回（unit/api は 3 周、e2e は --repeat-each=3）で flaky を検出"
    full_regression_cadence_days: 1 # 全件回帰は毎日（nightly）。週次はその 3 回繰り返し
    flaky_policy: >-
      retry で隠さない（Playwright retries=0）。同一 SHA・同一テストで pass/fail が混在したら flaky とし、
      nightly がラベル flaky の Issue を自動起票する。隔離は quality/flaky-ledger.yaml に期限付き（since から 30 日以内）で
      のみ許し、期限が切れたら docs-check が失敗する。隔離中も日次では実行する。台帳を空に保つのが目標。
      現状の台帳は 2 件（TC-073・TC-074。いずれも共有ランナーの負荷による絶対時間しきい値の揺れ。Issue #25・#37）。
  automation:
    ref: .github/workflows/ci.yml
    layers: [unit, api, contract, e2e, compose] # e2e は chromium / firefox / webkit / chromium-mobile-360。性能・外形監視は別層（perf.yml・synthetic.yml）
    required_checks: [ci-result, security-result]
    required_checks_note: "集約ジョブ。個別ジョブは required にしない。ただし Ruleset は未適用なので、現状 GitHub 側で必須化はされていない"
    maximum_feedback_minutes: 10 # PR のフィードバック時間の目標（= health-trend の p95 上限 600 秒。scripts/regression/health-trend.mjs・quality/README.md）。nightly.yml だけ 1800 秒（30 分。全件・全ブラウザの日次のため。per_workflow_p95_sec）で、PR の目標には含めない。実測は ci.yml の成功 run が 2.4〜4.4 分（PR #57 の本文）
    quarantine_policy: "quality/flaky-ledger.yaml に test_id・rate・cause・owner・since・expires_at（30 日以内）を書いた場合のみ隔離。期限切れは CI 失敗。retry による隠蔽は禁止"
    max_flaky_rate: 0.01 # 宣言値（本ファイルが初出）。quality/README.md は『台帳を空に保つのが目標』と書くのみで数値は無い。現状は 2 件の隔離がある
  api:
    ref: backend/openapi.yaml
    contract_format: "openapi 3.1"
    backward_compatibility_check: "oasdiff（scripts/ci/oasdiff-breaking.sh。base の openapi.yaml と比べ、破壊的変更 ERR で CI 失敗。イメージは digest 固定、版 v1.33.0）。あわせて redocly lint（npm run contract:lint）と contract テスト層"
    consumer_contracts:
      - "frontend（唯一の consumer。backend/openapi.yaml を契約として利用。Pact などの consumer-driven contract ツールは導入していない）"
    consumer_contracts_note: "外部の consumer は無い（integrations: []）。互換性方針は openapi.yaml の description（/api/v1 は後方互換。破壊的変更は v2）"
  performance:
    slo_reference: perf/slo.yaml
    required_scenarios: [load, stress, spike, soak, capacity] # perf/workload.yaml の scenarios
    environments:
      - "local:darwin-arm64（開発機の Docker Desktop。baseline.json の env_class。初回実測）"
      - "GitHub-hosted runner（perf.yml。Linux ネイティブ Docker。初回実行はまだ無く baseline は未作成: perf/README.md）"
    environments_note: "本番環境は無い（perf/environment.yaml の reference_production.exists=false）。絶対値は本番の予測ではなく、同じ環境の run 同士の相対比較に使う"
    workload_basis: "assumed（実測ではなく想定。導出は perf/workload.yaml#derivation）"
  monitoring:
    ref: monitoring/monitors.yaml
    critical_journeys: [J-01, J-02, J-03, J-04, J-05] # J-01〜J-04 は API と browser、J-05 は API（MON-013）。monitoring/monitors.yaml の journey_id
    regions: ["github-hosted-runner（リージョン非固定）"] # 多地点監視はできない（monitoring/README.md）
    max_interval_sec: 1800 # 30 分（synthetic.yml の cron の定義）。monitors の既定上限 300 秒は満たさない。理由は monitoring/README.md。**実績の schedule 間隔は 3〜7 時間**（2026-10-12 17:00 JST 時点で 4 回。GitHub の schedule の遅延・欠落。docs/11 の monitoring-06）
    max_retries: 2 # monitors.yaml の retries の最大値（MON-001・002・011・012 が 2、そのほかは 1）
    history_retention_days: 90 # GitHub Actions artifact の保持（synthetic.yml の retention-days）。Git に置く履歴（monitoring/history/）は永続だが保存例のみ
    history_note: "運用期間はまだ短い（4 週間未満）。schedule 実行は 2026-10-12 17:00 JST 時点で synthetic 4 回・死活監視 2 回（うち 1 回は実際に MON-META #59 を起票）・nightly 2 回（すべて成功）にとどまる。時間依存の傾向（FP/FN 率の推移・稼働率など）は実績が足りない（monitoring/fp-fn-log.md、docs/11 の monitoring-11）"

# ---------------------------------------------------------------------------------------------
inspection:
  ref: security/expected-scans.yaml
  expected_checks: [sast, dast, sca, secret, container, config, license, maintainability] # 実際に security.yml で走る検査（security/expected-scans.yaml の kind）。maintainability は PR #57 から scan-run.json に記録している（docs/08 の inspection-19〜21）。expected-scans.yaml にはほかに kind: architecture（check-arch.mjs。docs/08 の inspection-11）があるが、qc の検査種別（ScanCategory）に値が無いのでここには書かない
  not_expected: # 期待しない検査と理由
    - kind: iac
      reason: "Terraform などの IaC ファイルが無い。Dockerfile は hadolint と trivy（container）、compose は compose-check（config）で扱う"
    - kind: framework
      reason: "frontend は React・Vue などを使わない静的 HTML / ES modules で該当する規約が無い。backend は Fastify 5 を使うが、Fastify 用の専用 lint・規約検査は入れていない（規約の一部はテストと契約検査で固定。docs/08 の inspection-22）。専用の検査が無いのは『できていないこと』で、承認された対象外ではない"
    - kind: seo
      reason: "対象外（exceptions の inspection-12。公開コンテンツサイトではない）"
  license_policy_ref: security/license-policy.yaml
  tools_ref: security/tools.env # ツールの版は digest で固定
  severity_policy_ref: security/README.md # 重大度と是正期限（critical 7 日 / high 30 日 / medium 90 日）、トリアージ規則

