source_of_truth: # 正本の所在。docs/evidence/source-of-truth.yaml（生成物）が正本。ここは読みやすさのための要約
  ref: docs/evidence/source-of-truth.yaml
  items:
    requirements: { path: docs/data/requirements.csv, note: "要求（REQ）。行の正本は CSV" }
    ui: { path: spec/todo-phase1-spec.html, note: "画面仕様・入力規則・エラー文言・受け入れ条件（v1.1）" }
    api_spec: { path: backend/openapi.yaml, note: "API 契約（契約先行）" }
    architecture: { path: docs/adr, note: "アーキテクチャ判断（ADR）" }
    security_requirements: { path: security/README.md, note: "検査の方針・重大度と SLA・トリアージ規則" }
    slo: { path: perf/slo.yaml, note: "SLO（機械可読の正本）。source-of-truth.yaml の slo も present（C-001 は解消済み）" }
    test_perspectives: { path: docs/data/perspectives.csv, note: "テスト観点（VIEW）" }
    test_cases: { path: docs/data/cases.csv, note: "テストケース（TC）" }
    defects: { path: "GitHub Issues（label: defect / flaky）", note: "不具合の正本は Issue。docs/data/defects.csv は写し（docs/evidence/github/defect-issues.json から再生成）" }
  other_sources:
