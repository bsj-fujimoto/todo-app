contradictions: # 仕様と成果物の食い違いを実際に突き合わせた結果。見つけたものだけを書く
  checked_scope:
    as_of: "2026-10-12"
    compared:
      - "spec/todo-phase1-spec.html（v1.1）の機能・入力規則・エラー文言・データ項目・受け入れ条件・品質条件 ↔ backend/openapi.yaml・backend/src/errors.js・frontend/src/messages.js・frontend/index.html・docs/data/requirements.csv・docs/data/cases.csv・docs/03-test-spec.md §1.2"
      - "spec/todo-phase2-spec.html（v2.0）↔ spec v1.1・docs/adr/0001・backend/openapi.yaml・README.md"
      - "docs/02-test-perspectives.md・docs/03-test-spec.md の件数（要求 34・リスク 16・観点 69・未決 8・ケース 77）↔ docs/data の CSV の行数（一致）"
      - "quality/journeys.yaml の case_ids ↔ docs/data/cases.csv（全 TC が実在）。monitoring/monitors.yaml の journey_id ↔ quality/journeys.yaml（J-01〜J-05 が一致）"
      - "perf/slo.yaml の SLO・test_cases ↔ docs/data/cases.csv の TC-073〜TC-077 の期待値"
      - "docs/evidence/source-of-truth.yaml ↔ 実在するファイル"
    result_for_spec_v1_1: >-
      食い違い無し。エラー文言 5 種（必須・長さ・改行・保存失敗・データ破損）と空状態・見出し・プレースホルダは、仕様書・
      openapi.yaml・errors.js・messages.js・index.html で完全一致。検証順（必須 → 長さ → 改行）は仕様書本文に明記が無く
      openapi.yaml の TitleInvalid が規定する（REQ-031。UNK-001 で確定済みで、食い違いではなく仕様の補完）。
      AC-01〜AC-07 はすべて要求と docs/03-test-spec.md §1.2 のケースに対応する。保存先のボリューム名 todo-data は docker-compose.yml と一致。
    items_not_compared: "画面の見た目（色・位置）は仕様書に数値が無く比較していない。docs/01〜13 は、横断整合の PR（2026-10-12）で件数・状態・承認の書き方・時点依存の記述を突き合わせた範囲に限る（全文の突き合わせではない）。docs/07（性能）は未作成で突き合わせていない"
  items:
    - contradiction_id: C-003
      kind: state_mismatch
      summary: >-
        spec/todo-phase2-spec.html は、前提を『最小仕様書（Version 1.0）』、保存先を『localStorage の todo.tasks を引き続き使用』と
        書くが、フェーズ1は v1.1 で保存先を backend API（SQLite）へ変更している（CR-01、ADR-0001）。フェーズ2仕様の冒頭に読み替えの
        注記があり、具体化は docs/draft/phase2 で行うとされているが、docs/draft/ は未作成。v1.0.0 は
        フェーズ2を含まない（対象外）ので v1.0.0 の成果物には影響しない。フェーズ2の着手時に解消する。
      refs: [spec/todo-phase2-spec.html#05, spec/todo-phase1-spec.html#09, docs/adr/0001-frontend-backend-split.md]
      domains: [spec]
  resolved: # 解消した食い違い（qc-analyzer の食い違いの一覧には含めない。経緯を残す）
    - contradiction_id: C-001
      resolved_at: "2026-10-12"
      summary: >-
        docs/evidence/source-of-truth.yaml が SLO の正本を status: missing としていたが perf/slo.yaml は存在した。
      resolution: >-
        `npm run evidence:build` の再生成で解消した。現在の source-of-truth.yaml の slo は path: perf/slo.yaml・artifact_id: ART-52・
        status: present。
      refs: [docs/evidence/source-of-truth.yaml#source_of_truth.slo, perf/slo.yaml]
    - contradiction_id: C-002
      resolved_at: "2026-10-12"
      summary: >-
        perf/slo.yaml の health_p95_ms（health の応答時間 p95 ≤ 200ms）が test_cases: [TC-075] に紐づくが、TC-075 の期待結果
        （docs/data/cases.csv）に応答時間の判定が無かった。
      resolution: >-
        実態に合わせて slo.yaml 側を直した。TC-075 は @smoke（必須・毎回実行）で、health の内容（200・4 キー・version・commit・認証なし）
        だけを検査している（backend/test/api/contract.test.js）。応答時間の p95 は perf 層（scripts/perf/observe.mjs の health プローブ
        を scripts/perf/verdict.mjs が判定）と外形監視 MON-002 の応答時間 assertion が判定しているので、health_p95_ms の
        test_cases を [] にし、judged_by にこの 3 つを書いた。TC-075 に時間の判定は足していない（共有ランナーの揺れで必須ケースが
        落ちる恐れがあり、TC-073・TC-074 が flaky になった前例がある。Issue #25・#37）。
      refs: [perf/slo.yaml#health_p95_ms, docs/data/cases.csv#TC-075]
  none_found_note: "上記 1 件（C-003）以外は、突き合わせた範囲（checked_scope）で食い違いを見つけていない。推測で矛盾を作っていない"

