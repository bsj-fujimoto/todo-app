unknowns: # 未決の正本は CSV。ここは管理規則と、書いた日の要約だけ
  source: docs/data/unknowns.csv
  columns: [unknown_id, question, owner_role, due_date, status, resolution, resolved_at]
  rules:
    - "未決は UNK-nnn で登録し、owner_role（ロール）と due_date（期限）を必ず付ける"
    - "status は open / resolved。resolved には決定者（ロール）・決定内容・resolved_at を resolution に書き、関連ケース（TC）を確定させる"
    - "仕様に書かれていないことは推測で埋めず UNK に起こす。判断できない観点は perspectives.csv で status=pending にして unknown_ids で紐づける"
    - "期限を過ぎた open は、延長するか決める。放置しない"
  summary_as_of_2026_10_12:
    total: 8
    open: 1 # UNK-002（タスク件数の上限。owner プロダクトオーナー、期限 2026-10-16）。性能試験の件数想定（千件規模）の根拠にも関わる
    resolved: 7
  note: "件数は CSV から数え直した値で、CSV が更新されたら古くなる。最新は CSV を読む"

