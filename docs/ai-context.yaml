# 承認済み対象外（採点の分母から外す唯一の入口）。理由は docs/01-test-plan.md の plan-03 と一致させる（同時に別担当が作成中）。
# 食い違ったら plan-03 を正として、ここを直す。approved_by は『ロール + 承認の根拠』を正直に書く。
exceptions:
  - exception_id: EXC-001
    criterion_id: api-02
    reason: "認証なしの 1 人用で、認証が要る endpoint が無い（REQ-015。openapi.yaml に security scheme も 401/403 も無い）。認証・認可の API 試験は対象にならない"
    approved_by: プロダクトオーナー
    approval_basis: "本ファイルを含む PR のマージをもって承認。フェーズ1は AI が代行マージ（オーナーの明示許可 2026-10-11）。マージ前は draft"
    approved_at: "2026-10-12"
    expires_at: "2027-04-12"
    review_by: "2027-01-12" # docs/01 の plan-03（api-02）に合わせた見直し日
    review_trigger: "認証・認可を仕様に加えたとき"
  - exception_id: EXC-002
    criterion_id: api-08
    reason: "ページングを持つ endpoint が無い（GET /api/v1/tasks は全件返却。openapi.yaml に limit / offset / cursor が無い）。件数の上限は UNK-002（open）で未決"
    approved_by: プロダクトオーナー
    approval_basis: "本ファイルを含む PR のマージをもって承認。フェーズ1は AI が代行マージ（オーナーの明示許可 2026-10-11）。マージ前は draft"
    approved_at: "2026-10-12"
    expires_at: "2027-04-12"
    review_by: "2026-10-16（UNK-002 の回答期限）。件数が 5,000 を超えたら即時" # docs/01 の plan-03（api-08）に合わせた見直し日
    review_trigger: "ページングを導入したとき、または UNK-002 の決定で件数上限・ページングが決まったとき"
  - exception_id: EXC-003
    criterion_id: inspection-12
    reason: "公開コンテンツサイトではなく、SEO / AIO の対象外（個人用のログイン不要アプリ。検索エンジンに載せる目的が無い）"
    approved_by: プロダクトオーナー
    approval_basis: "本ファイルを含む PR のマージをもって承認。フェーズ1は AI が代行マージ（オーナーの明示許可 2026-10-11）。マージ前は draft"
    approved_at: "2026-10-12"
    expires_at: "2027-04-12"
    review_by: "2027-04-12" # docs/01 の plan-03（inspection-12）と同じ
    review_trigger: "公開 Web サイトとして外部へ公開するとき"
  - exception_id: EXC-004
    criterion_id: monitoring-05
    reason: "認証が無く、認証付き監視が存在しない。ただし書込みを伴う監視は専用の合成データで行い、作ったデータは必ず後始末する（書込みを伴う MON-003・004・005・007・008・009 の data_cleanup）"
    approved_by: プロダクトオーナー
    approval_basis: "本ファイルを含む PR のマージをもって承認。フェーズ1は AI が代行マージ（オーナーの明示許可 2026-10-11）。マージ前は draft"
    approved_at: "2026-10-12"
    expires_at: "2027-04-12"
    review_by: "2027-01-12" # docs/01 の plan-03（monitoring-05）に合わせた見直し日。api-02 の見直しと同時
    review_trigger: "認証を導入したとき"
  - exception_id: EXC-005
    criterion_id: regression-15
    reason: "外部連携が無く、frontend と backend は同一リリース単位（同じ commit・同じタグから両イメージを作る）。連携先との互換性回帰・バージョン組合せの回帰は要らない"
    approved_by: プロダクトオーナー
    approval_basis: "本ファイルを含む PR のマージをもって承認。フェーズ1は AI が代行マージ（オーナーの明示許可 2026-10-11）。マージ前は draft"
    approved_at: "2026-10-12"
    expires_at: "2027-04-12"
    review_by: "2026-12-31（または /api/v2 を出す判断のとき、どちらか早い方）" # docs/01 の plan-03（regression-15）に合わせた見直し日
    review_trigger: "外部連携を追加したとき、または frontend と backend を別リリースにするとき"
exceptions_rule: "対象外には理由・承認者（ロール）・承認日・期限（見直し日）が必須。期限を過ぎたら見直す（延長も PR）。承認が実際に無いものを approved にしない"
exceptions_dates_note: >-
  expires_at と review_by は意味が違う。expires_at は承認の有効期限（これを過ぎると承認が失効し、対象外として扱わない。
  qc-analyzer の exceptions[].expires_at）。review_by は見直し日（これまでに、前提が崩れていないかを確かめて判断を更新する。
  docs/01 の plan-03 の「見直し日」と同じ値）。review_by は expires_at より前か同じ。plan-03 を正とし、食い違ったらここを直す。

