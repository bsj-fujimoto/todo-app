# AI 向けプロダクト文脈（todo-app）。機械可読。人も読める。
#
# 目的
#   成果物（docs/・quality/・perf/・monitoring/・security/・.github/）を読む AI（qc-analyzer を含む）と人が、
#   「この製品は何で、何を守り、何を対象外にし、何が未決で、どこに正本があるか」を 1 か所で読めるようにする。
#   qc-analyzer の正規化入力 context（product / repository / identifiers / strategy / inspection / scope /
#   exceptions / unknowns / contradictions / ai_policy）に当たる情報を、散らばらせず、事実に基づいて集める。
#
# 読み方
#   - このファイルは「索引と要約」。実体は各 ref のパスにある。値は転記ではなく、根拠（ref）付きで要約している。
#     食い違ったら、このファイルではなく ref 先（正本）が正しい。見つけたら contradictions に記録して直す。
#   - 数字・判定は書かれた日（as_of）の実態。時間とともに変わるもの（件数・run・適用状況）は ref 先で確認する。
#   - 無いものは「無い」、できていないことは「できていない」と書く。空欄は問題なしの意味ではない。
#
# 更新規則（docs/README.md「更新規則」の表も参照）
#   - 変更は PR で行う（GitHub Flow）。CODEOWNERS により docs/ はプロダクトオーナーのレビュー対象。
#   - 正本（quality/journeys.yaml・perf/slo.yaml・monitoring/monitors.yaml・.github/settings/・security/ など）を変えたら、
#     同じ PR でこのファイルの対応する節を直す。リリースのたびに release・commit・as_of を見直す。
#   - 状態: draft（オーナーの確認待ち。PR マージ＝承認の代行。マージされても、オーナーの確認が済むまで reviewed・approved にしない）。
#
# 承認の扱い（正直に）
#   リポジトリは単独のリポジトリオーナー + AI エージェントで運用している。ロールは兼務で、不在時の代理は置けない。
#   「承認」は、リポジトリオーナーが PR をマージした時点とする。フェーズ1の PR のマージは、オーナーの明示許可
#   （2026-10-11）に基づく AI の代行マージである。本ファイルの approved_by はすべてこの意味で読む。
version: 1
document:
  id: DOC-AI-CONTEXT
  version: "1.1"
  as_of: "2026-10-12"
  status: "draft（オーナーの確認待ち。PR マージ＝承認の代行）"
  target: "todo-app 仕様書 v1.1（spec/todo-phase1-spec.html）、リリース v1.0.0"
  target_commit: "5fcf40a7e58dc253e53ff56860d0669a69abda26" # タグ v1.0.0 の製品 commit
  authors: "ドキュメント管理担当（AI が作成）"
  reviewer: "QA リード（ロール。兼務）"
  approval: "プロダクトオーナー（PR のマージをもって承認。フェーズ1は AI が代行マージ。オーナーの確認が済むまで draft）"
  canonical_store: "Git（本リポジトリの main。履歴は永続。force push・ブランチ削除は Ruleset で禁止する設計だが、Ruleset は未適用: repository.expected_controls 参照）"

# ---------------------------------------------------------------------------------------------
product:
  name: todo-app
  description: "個人用の最小 ToDo アプリ（frontend: nginx 静的配信 / backend: Node.js 24 + Fastify + SQLite / docker compose）。同時に QA/QC 成果物のお手本。"
  release: "v1.0.0"
  release_ref: "git tag v1.0.0 → commit 5fcf40a7e58dc253e53ff56860d0669a69abda26。GitHub Release は v1.0.0（2026-10-12 時点で唯一）"
  criticality: low # 個人用のサンプル。本番環境が無い（SECURITY.md）
  data_classification: "internal（アプリの実行はローカル・社内の検証用。合成データのみで、個人情報・秘密情報を扱わない）"
  data_classification_note: >-
    アプリが扱うデータの分類は internal（外部公開の本番環境は無い）。一方でリポジトリ自体は public で、
    docs/ や証跡の内容は誰でも読める（分類は public。docs/evidence/README.md「データ分類・アクセス・秘密情報」）。
    internal に当たるものはこのリポジトリに置かない。テストデータは合成データのみ（docs/data/datasets.csv）。
  service_tier: "best-effort（本番環境なし・SLA なし。perf/slo.yaml の目標は実測ではなく想定に基づく社内目標）"
  user_journeys: # quality/journeys.yaml の J-01〜J-05 と同じ。名前は転記。risk_ids の導出規則は derivation に書く
    - journey_id: J-01
      name: タスクを追加して再読込しても残る
      risk_ids: [RISK-001, RISK-015]
      owner_role: バックエンド担当
    - journey_id: J-02
      name: 完了を切り替えると表示と保存データの両方に反映される
      risk_ids: [RISK-003, RISK-006]
      owner_role: フロントエンド担当
    - journey_id: J-03
      name: タスクを削除すると一覧と保存データから消え、他のタスクは変わらない
      risk_ids: [RISK-003, RISK-013]
      owner_role: バックエンド担当
    - journey_id: J-04
      name: 不正入力が弾かれ、保存データが変わらない
      risk_ids: [RISK-002, RISK-008]
      owner_role: フロントエンド担当
    - journey_id: J-05
      name: 保存に失敗しても・保存データが壊れていても、データを守る
      risk_ids: [RISK-001, RISK-003, RISK-004, RISK-011, RISK-013]
      owner_role: バックエンド担当
  user_journeys_ref: quality/journeys.yaml
  user_journeys_derivation: >-
    quality/journeys.yaml に risk_ids の欄は無い。そこで risk_ids は、(a) journeys.yaml の why が名指しした RISK
    （J-01=RISK-001、J-04=RISK-002、J-05=RISK-003/004）と、(b) そのジャーニーのケース（case_ids）の risk_ids
    （docs/data/cases.csv）のうち 2 件以上のケースに現れる RISK、の和集合とした。
    リスクの正本は docs/data/risks.csv。ジャーニー側に risk_ids を持たせるのが本筋で、持たせたらここは参照だけにする。
  public_interfaces:
    - kind: web
      url: "http://localhost:8080/" # docker compose の frontend（nginx）。外部公開の本番 URL は無い
    - kind: api
      url: "http://localhost:8080/api/v1" # nginx が /api を backend へ中継。backend のポートはホストへ公開しない
    - kind: api-health
      url: "http://localhost:8080/api/v1/health"
    - kind: api-contract
      url: "backend/openapi.yaml" # OpenAPI 3.1。API 契約の正本
    - kind: container-image
      url: "ghcr.io/bsj-fujimoto/todo-app-backend; ghcr.io/bsj-fujimoto/todo-app-frontend" # monitoring/target.yaml
  slo_references: # perf/slo.yaml の metric（値は slo.yaml が正本。ここに転記しない）
    - perf/slo.yaml#api_list_p95_ms
    - perf/slo.yaml#api_list_p99_ms
    - perf/slo.yaml#api_create_p95_ms
    - perf/slo.yaml#api_update_p95_ms
    - perf/slo.yaml#api_delete_p95_ms
    - perf/slo.yaml#screen_ready_ms
    - perf/slo.yaml#error_rate
    - perf/slo.yaml#throughput_rps
    - perf/slo.yaml#health_p95_ms
    - perf/slo.yaml#availability_synthetic_ratio
  slo_basis: "perf/slo.yaml の basis 欄が正本。暫定値を確定したもの（provisional-confirmed）と、実測の利用実態が無い想定（assumed）が混在する。実測ログは無い"
  roles: # 人名・アカウント名は書かない。ロール名のみ
    - プロダクトオーナー
    - 開発リード
    - QA リード
    - QA 担当
    - バックエンド担当
    - フロントエンド担当
    - セキュリティ担当
    - 運用（SRE）担当
    - メンテナ
  roles_note: >-
    単独のリポジトリオーナー + AI エージェントによる運用で、ロールはすべて兼務。複数人の分担・相互レビュー・不在時の代理は
    置けない（制約）。人の目によるレビューは、オーナーが PR をマージした時点の承認で代える。
    利用者は 1 人（認証なし・1 インスタンス = 1 人用。spec/todo-phase1-spec.html §01）。
  integrations: [] # 外部連携は無い。外部サービスへの依存・Webhook・メール送信・SSO はなく、backend は SQLite のみに依存する
  integrations_note: "外部連携なし（perf/environment.yaml の env_diff.mocks も空）。したがって consumer-driven contract や連携先の試験は対象外（exceptions の regression-15）"

