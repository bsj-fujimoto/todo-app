ai_policy: # AI が成果物を読む・使うときの規則
  ref: "docs/ai-context.yaml（本ファイル）、docs/evidence/README.md、docs/README.md"
  rules:
    - id: AI-01
      rule: "正本は Git（main）。コピー・要約・スナップショットと食い違ったら正本が正しい。正本が CSV のものは CSV を、不具合は GitHub Issues を読む（docs/evidence/source-of-truth.yaml）"
    - id: AI-02
      rule: "推測で埋めない。書かれていない値・決まっていないことは『不明』として UNK に起こす。空欄を『問題なし』『該当なし』と読まない"
    - id: AI-03
      rule: "未収集・未実施・未適用は、そのまま未収集・未実施・未適用と書く（例: Ruleset は未適用、手動ケースは not_run、runner の性能 baseline は未作成）。成功に見せない"
    - id: AI-04
      rule: "原本（spec/・backend/openapi.yaml・docs/data/ の正本 CSV・docs/evidence/ の証跡）を AI が書き換えない。生成物（artifacts.yaml・source-of-truth.yaml・manifest.json・defects.csv など）は手で編集せず生成スクリプトで作り直す"
    - id: AI-05
      rule: "人名・GitHub アカウント名・メールアドレスを成果物に転載しない。ロール名で書く。秘密情報（トークン・鍵・パスワード）・個人情報は読み込んでも書き出さない。見つけたら転載せず報告する"
    - id: AI-06
      rule: "AI が作成・代行した事実を隠さない。成果物の作成は AI、承認は『プロダクトオーナー（PR のマージをもって承認。フェーズ1は AI が代行マージ）』と書く。承認が実際に無いものを approved にしない"
    - id: AI-07
      rule: "数字は出典（パス・Issue・run）とともに書く。件数・時刻・版は転記せず、読む時点で CSV・run から数え直す。時間依存の事実（運用日数・履歴）はまだ短い（4 週間未満）と書く"
    - id: AI-08
      rule: "対象外（N/A）は理由・承認者（ロール）・承認日・期限が揃ったものだけを認める（exceptions）。揃わないものは対象外にせず、未実施として扱う"
    - id: AI-09
      rule: "採点・評価の結果を成果物に書き込むときは、評価する側と作成する側を分ける。作成した AI 自身が採点結果を承認しない"
    - id: AI-10
      rule: "AI 向けデータ（本ファイルなど）と原本の版を揃える。対象の release・commit（document.target_commit）と as_of を確認し、版が違えば読み直す"
  prohibited:
    - "正本に無い数字・承認・実施結果を作ること"
    - "検査結果・テスト結果の改変、観察値の捏造、失敗の隠蔽（retry で隠すことを含む）"
    - "証跡（docs/evidence/）へ token・個人情報・巨大な trace を持ち込むこと"
  data_handling: "リポジトリは public。ここに置いた内容は誰でも読める。internal に当たるものは置かない（docs/evidence/README.md）"

