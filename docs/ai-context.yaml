repository:
  provider: github
  owner: bsj-fujimoto # リポジトリの座標（gh api repos/bsj-fujimoto/todo-app）。本文中の人名の扱いとは別
  name: todo-app
  visibility: public # gh api repos/bsj-fujimoto/todo-app（2026-10-12）
  plan: "free（リポジトリオーナーの前提。個人アカウントで、gh api からは契約プランを取得できないので API では未確認）"
  default_branch: main
  entitlements: # 2026-10-12 に gh api（read-only）で確認できた範囲
    code_security: "Code Scanning は利用できる（高度な設定: security.yml の CodeQL が SARIF をアップロード。gh api .../code-scanning/alerts が 200 で open アラートを返す）。簡易設定（default setup）は not-configured"
    secret_protection: "secret scanning=enabled、push protection=enabled。non-provider patterns=disabled、validity checks=disabled（repo-settings.json は enabled を期待しており差分 2 件。scripts/ci/apply-settings.sh --dry-run で確認。無料プランでは有効にできなかったという認識だが、有効化の拒否そのものは read-only の確認では再現していない）"
    dependency_review_private_repo: "not_applicable（リポジトリは public。dependency-review-action は PR で実行する。private リポジトリ向けの契約は使っていない）"
  entitlements_note: "契約状態が分からないものを enabled と書かない。取得に失敗した API（403/404）は『問題なし』ではなく『権限か契約か機能無効かが不明』として扱う（.github/settings/README.md）"
  expected_controls:
    as_of: "2026-10-12"
    observed_by: "gh api repos/bsj-fujimoto/todo-app と /rulesets、scripts/ci/apply-settings.sh --dry-run（いずれも read-only）"
    ruleset_main:
      expected_ref: .github/settings/ruleset-main.json
      expected: "main への PR 必須・squash のみ・承認 1 + code owner review・stale review 無効化・required checks（ci-result / security-result・strict）・force push 禁止・ブランチ削除禁止・linear history。bypass は Admin ロールの pull_request モードのみ（単独メンテナのため。直接 push は不可）"
      applied: false
      observed: "gh api repos/bsj-fujimoto/todo-app/rulesets が []（Ruleset 0 件）。classic branch protection も 404（Branch not protected）"
      consequence: "main は現状、GitHub 側では保護されていない。承認・required checks・force push 禁止は設計どおりには強制されていない"
      plan: "ci-result と security-result が main で成功済みであることを確認してから、リポジトリ管理者が .github/settings/README.md の手順（apply-settings.sh --dry-run → 適用 → snapshot-github.sh で確認）で適用する。適用日は未定"
    ruleset_release_tags:
      expected_ref: .github/settings/ruleset-release-tags.json
      expected: "タグ v* の削除・更新・force を禁止（作成は許す）"
      applied: false
      observed: "Ruleset 0 件。タグ v1.0.0 は存在する（gh api .../tags）が、保護はされていない"
    required_checks: [ci-result, security-result] # .github/workflows/ci.yml・security.yml の集約ジョブ
    required_checks_enforced: false # Ruleset が未適用のため
    codeowners:
      ref: .github/CODEOWNERS
      state: "ファイルあり（* と /docs/ /backend/openapi.yaml /.github/ をプロダクトオーナー兼メンテナ）。code owner review を要求するのは Ruleset なので、未適用の間は強制されない"
    dependabot:
      ref: .github/dependabot.yml
      applied: true
      state: "version updates の設定ファイルあり（npm・github-actions・docker・compose、週次、cooldown 3 日）。Dependabot alerts と security updates は enabled（apply-settings.sh --dry-run で差分なし / gh api の dependabot_security_updates=enabled）"
    actions_permissions:
      applied: true
      state: "allowed_actions=selected、sha_pinning_required=true（gh api .../actions/permissions）。workflow の既定権限 read・フォーク PR の承認は dry-run で差分なし"
    repo_settings_diff_remaining: "dry-run の未適用差分: secret scanning の 2 項目、ラベル incident、Ruleset 2 件（2026-10-12 時点）"
    merge_policy: "squash のみ・マージ後ブランチ削除（delete_branch_on_merge=true は適用済み。dry-run で差分なし）。allow_auto_merge=false"
    review_reality: "実態は単独オーナー + AI。PR 作成者以外の承認者がいないため、承認 1 件の要求は admin bypass（PR 経由のみ）が前提。bypass して CI が赤のままマージしない運用ルール（.github/settings/README.md）"

