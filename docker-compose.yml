# docker compose up --build で http://localhost:8080 が動く。
# backend のポートはホストへ公開しない（frontend の nginx が /api を中継する）。
# 公開ポートを変えるときは FRONTEND_PORT、ビルドの commit SHA は COMMIT_SHA（/api/v1/health の commit に出る）。
name: todo-app

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        COMMIT_SHA: ${COMMIT_SHA:-unknown}
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      DB_PATH: /data/todo.db
      COMMIT_SHA: ${COMMIT_SHA:-unknown}
    volumes:
      - todo-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  todo-data:
